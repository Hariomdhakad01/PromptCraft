services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    ports:
      - "3001:3000"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    env_file:
      - ./backend/.env
    environment:
      MONGODB_URI: mongodb://mongo:27017/newgenai
      CORS_ORIGIN: http://localhost:5173
    depends_on:
      - mongo
    command: npm run dev

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_PROXY_TARGET: http://backend:3000
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0

volumes:
  backend_node_modules:
  frontend_node_modules:
  mongo_data:


